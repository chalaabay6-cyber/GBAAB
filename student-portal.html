<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f2;--panel:#fff;--ink:#14302f;--mute:#5d716f;--line:#d8dfdb;--brand:#14504e;--brand-ink:#fff;--accent:#e8a317;--ok:#1f7a4d;--err:#b3342b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1b;--panel:#152827;--ink:#e6efed;--mute:#9bb0ad;--line:#2a4140;--brand:#5fc0b6;--brand-ink:#0e1b1b;--ok:#5fd09a;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1b1b;--panel:#152827;--ink:#e6efed;--mute:#9bb0ad;--line:#2a4140;--brand:#5fc0b6;--brand-ink:#0e1b1b;--ok:#5fd09a;--err:#ff8a80}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--brand);color:var(--brand-ink);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:1.15rem;margin:0 8px 18px;font-weight:800}
nav a{display:block;color:inherit;text-decoration:none;padding:8px 10px;border-radius:6px;opacity:.85;font-size:.95rem}
nav a:hover,nav a:focus-visible{opacity:1;background:rgba(255,255,255,.14);outline:none}
nav a.on{opacity:1;background:var(--accent);color:#14302f;font-weight:600}
nav hr{border:0;border-top:1px solid rgba(255,255,255,.25);margin:12px 0}
main{padding:32px clamp(16px,4vw,48px);max-width:860px;width:100%}
h2{font-size:2rem;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.lead{color:var(--mute);margin:0 0 24px;max-width:60ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button,.btn{font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:10px 18px;cursor:pointer;margin-top:18px}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line);margin:0 0 0 6px;padding:5px 10px;font-size:.85rem}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.meta{color:var(--mute);font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tiles a{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;color:inherit;text-decoration:none}
.tiles a:hover{border-color:var(--brand)}
.tiles b{display:block;margin-bottom:2px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:9}
.err{color:var(--err);font-size:.85rem;margin-top:4px}
.empty{color:var(--mute);padding:8px 0}
@media (max-width:760px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}nav h1{width:100%}nav hr{display:none}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<nav id="nav" aria-label="Main"></nav>
<main id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status"></div>
<script>
const pages=[["home","Home"],["about","About"],["contact","Contact"],["sep"],["signup","Create account"],["department","Department registration"],["sep"],["assignment","Submit assignment"],["group","Group project"],["documents","Documents"],["profile","Profile settings"]];
const dflt={profile:{name:"Student",email:"",phone:"",bio:""},depts:[],assignments:[],groups:[],docs:[],accounts:[],messages:[]};
let S=JSON.parse(JSON.stringify(dflt));
try{const r=localStorage.getItem("portal");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("portal",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2400)}
const fmt=()=>new Date().toLocaleString();
const fileName=f=>f&&f.files[0]?f.files[0].name:"";
const field=(id,l,t="text",extra="")=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" ${extra}>`;
const val=id=>$(id).value.trim();
function must(ids){let ok=true;ids.forEach(i=>{const e=$(i);e.nextElementSibling?.classList.contains("err")&&e.nextElementSibling.remove();if(!e.value.trim()){ok=false;e.insertAdjacentHTML("afterend",'<div class="err">This field is required.</div>')}});return ok}
const deptOpts=()=>`<option value="">Select department</option>`+S.depts.map(d=>`<option>${esc(d.dept)}</option>`).join("");
const hdr=(t,l)=>`<h2>${t}</h2><p class="lead">${l}</p>`;

const V={
home(){return hdr(`Welcome, ${esc(S.profile.name)}`,"Everything for your coursework in one place.")+`<div class="tiles">
<a href="#assignment"><b>Submit assignment</b><span class="meta">${S.assignments.length} submitted</span></a>
<a href="#group"><b>Group project</b><span class="meta">${S.groups.length} submitted</span></a>
<a href="#documents"><b>Documents</b><span class="meta">${S.docs.length} uploaded</span></a>
<a href="#department"><b>Department</b><span class="meta">${S.depts.length?esc(S.depts[S.depts.length-1].dept):"Not registered"}</span></a></div>`},
about(){return hdr("About","What this portal is for.")+`<div class="card"><p>The student portal lets you register with your department, hand in individual assignments and group projects, keep your documents in order and manage your profile.</p><p class="meta">Submissions are saved in this browser and time-stamped when you send them.</p></div>`},
contact(){return hdr("Contact","Send a question to the registrar's office.")+`<div class="card">${field("c1","Your name")}${field("c2","Email","email")}<label for="c3">Message</label><textarea id="c3"></textarea><button id="go">Send message</button></div>`},
signup(){return hdr("Create account","Set up a new student account.")+`<div class="card"><div class="row"><div>${field("a1","Full name")}</div><div>${field("a2","Student ID")}</div></div>${field("a3","Email","email")}${field("a4","Password","password",'autocomplete="new-password"')}${field("a5","Confirm password","password",'autocomplete="new-password"')}<button id="go">Create account</button></div>`+list(S.accounts,a=>`${esc(a.name)} <span class="meta">${esc(a.id)}</span>`,"No accounts created yet.")},
department(){return hdr("Department registration","Register for the department you study in.")+`<div class="card"><div class="row"><div>${field("d1","Student ID")}</div><div><label for="d2">Department</label><select id="d2"><option value="">Select department</option>${["Computer Science","Engineering","Business","Medicine","Law","Arts & Humanities","Natural Sciences"].map(x=>`<option>${x}</option>`).join("")}</select></div></div><div class="row"><div><label for="d3">Level</label><select id="d3"><option value="">Select level</option>${[1,2,3,4,5].map(x=>`<option>Year ${x}</option>`).join("")}</select></div><div><label for="d4">Semester</label><select id="d4"><option value="">Select semester</option><option>Semester 1</option><option>Semester 2</option></select></div></div><button id="go">Register</button></div>`+list(S.depts,d=>`${esc(d.dept)} <span class="meta">${esc(d.lvl)}, ${esc(d.sem)} · ${d.at}</span>`,"No registrations yet.")},
assignment(){return hdr("Submit assignment","Hand in individual work.")+`<div class="card"><div class="row"><div>${field("s1","Course code")}</div><div>${field("s2","Assignment title")}</div></div><label for="s3">Notes</label><textarea id="s3"></textarea>${field("s4","Attach file","file")}<button id="go">Submit assignment</button></div>`+list(S.assignments,a=>`${esc(a.title)} <span class="meta">${esc(a.course)} · ${esc(a.file||"no file")} · ${a.at}</span>`,"Nothing submitted yet.")},
group(){return hdr("Group project","Submit once on behalf of your whole group.")+`<div class="card"><div class="row"><div>${field("g1","Project title")}</div><div>${field("g2","Group name")}</div></div><label for="g3">Members (one per line)</label><textarea id="g3"></textarea><label for="g4">Summary</label><textarea id="g4"></textarea>${field("g5","Attach file","file")}<button id="go">Submit project</button></div>`+list(S.groups,g=>`${esc(g.title)} <span class="meta">${esc(g.group)} · ${g.n} members · ${esc(g.file||"no file")} · ${g.at}</span>`,"No projects submitted yet.")},
documents(){return hdr("Documents","Upload, rename or remove your files.")+`<div class="card">${field("u1","Document name")}${field("u2","File","file")}<button id="go">Upload document</button></div><div class="card"><ul class="list">${S.docs.length?S.docs.map((d,i)=>`<li><span>${esc(d.name)} <span class="meta">${esc(d.file)} · ${d.at}</span></span><span><button class="sec" data-e="${i}">Edit</button><button class="sec" data-d="${i}">Delete</button></span></li>`).join(""):'<li class="empty">No documents yet. Upload your first file above.</li>'}</ul></div>`},
profile(){const p=S.profile;return hdr("Profile settings","Update how you appear in the portal.")+`<div class="card">${field("p1","Full name","text",`value="${esc(p.name)}"`)}${field("p2","Email","email",`value="${esc(p.email)}"`)}${field("p3","Phone","tel",`value="${esc(p.phone)}"`)}<label for="p4">Bio</label><textarea id="p4">${esc(p.bio)}</textarea><label for="p5">Theme</label><select id="p5"><option value="">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="go">Save changes</button></div>`}
};
function list(a,f,empty){return `<div class="card"><ul class="list">${a.length?a.slice().reverse().map(x=>`<li><span>${f(x)}</span></li>`).join(""):`<li class="empty">${empty}</li>`}</ul></div>`}

const H={
contact(){if(!must(["c1","c2","c3"]))return;S.messages.push({n:val("c1"),m:val("c3"),at:fmt()});save();toast("Message sent");render()},
signup(){if(!must(["a1","a2","a3","a4","a5"]))return;if(val("a4").length<8){$("a4").insertAdjacentHTML("afterend",'<div class="err">Use at least 8 characters.</div>');return}
 if(val("a4")!==val("a5")){$("a5").insertAdjacentHTML("afterend",'<div class="err">Passwords do not match.</div>');return}
 S.accounts.push({name:val("a1"),id:val("a2"),email:val("a3")});save();toast("Account created");render()},
department(){if(!must(["d1","d2","d3","d4"]))return;S.depts.push({sid:val("d1"),dept:val("d2"),lvl:val("d3"),sem:val("d4"),at:fmt()});save();toast("Department registered");render()},
assignment(){if(!must(["s1","s2"]))return;S.assignments.push({course:val("s1"),title:val("s2"),file:fileName($("s4")),at:fmt()});save();toast("Assignment submitted");render()},
group(){if(!must(["g1","g2","g3"]))return;S.groups.push({title:val("g1"),group:val("g2"),n:val("g3").split("\n").filter(x=>x.trim()).length,file:fileName($("g5")),at:fmt()});save();toast("Project submitted");render()},
documents(){if(!must(["u1"]))return;if(!fileName($("u2"))){$("u2").insertAdjacentHTML("afterend",'<div class="err">Choose a file to upload.</div>');return}S.docs.push({name:val("u1"),file:fileName($("u2")),at:fmt()});save();toast("Document uploaded");render()},
profile(){if(!must(["p1"]))return;S.profile={name:val("p1"),email:val("p2"),phone:val("p3"),bio:val("p4")};const t=val("p5");t?document.documentElement.dataset.theme=t:delete document.documentElement.dataset.theme;save();toast("Changes saved");render()}
};
function render(){
 const k=(location.hash||"#home").slice(1);const page=V[k]?k:"home";
 $("nav").innerHTML=`<h1>Student Portal</h1>`+pages.map(p=>p[0]==="sep"?"<hr>":`<a href="#${p[0]}" class="${p[0]===page?"on":""}">${p[1]}</a>`).join("");
 $("main").innerHTML=V[page]();
 const g=$("go");if(g&&H[page])g.onclick=H[page];
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.docs.splice(+b.dataset.d,1);save();toast("Document deleted");render()});
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const d=S.docs[+b.dataset.e];const n=prompt("Rename document",d.name);if(n&&n.trim()){d.name=n.trim();save();toast("Document updated");render()}});
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});render();
</script>
</body>
</html>
